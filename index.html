
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viper Clan – Anmeldung</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #09090d;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .panel {
      width: 100%;
      max-width: 440px;
      padding: 30px;
      border: 1px solid #6929a5;
      border-radius: 18px;
      background: #14121b;
      text-align: center;
      box-shadow: 0 0 30px #7026a522;
    }
    h1 { color: #c084fc; margin-bottom: 8px; }
    p { color: #c8c4d2; overflow-wrap: anywhere; }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }
    .google { background: #fff; color: #222; }
    .discord { background: #5865f2; color: white; }
    .logout { background: #7829a8; color: white; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { margin-top: 18px; font-size: 14px; }
    #account { margin-top: 20px; }
    .hidden { display: none; }
    code { color: #d8b4fe; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>🐍 VIPER CLAN</h1>
    <p>Melde dich an, um weiterzumachen.</p>

    <section id="login">
      <button class="google" id="googleBtn">
        Mit Google anmelden
      </button>
      <button class="discord" id="discordBtn">
        Mit Discord anmelden
      </button>
    </section>

    <section id="account" class="hidden">
      <h2>Du bist angemeldet!</h2>
      <p>E-Mail: <span id="email"></span></p>
      <p>Deine User-ID:</p>
      <code id="userId"></code>
      <button class="logout" id="logoutBtn">Abmelden</button>
    </section>

    <p id="status">Verbindung wird vorbereitet …</p>
  </main>

  <script type="module">
    import {
      createClient
    } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // WICHTIG: Hier deine echten Supabase-Daten eintragen.
    const SUPABASE_URL = "DEINE_SUPABASE_PROJECT_URL";
    const SUPABASE_KEY = "DEIN_PUBLISHABLE_KEY";

    const statusEl = document.getElementById("status");
    const loginEl = document.getElementById("login");
    const accountEl = document.getElementById("account");
    const googleBtn = document.getElementById("googleBtn");
    const discordBtn = document.getElementById("discordBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    let supabase;

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function setBusy(busy) {
      googleBtn.disabled = busy;
      discordBtn.disabled = busy;
      logoutBtn.disabled = busy;
    }

    function showUser(user) {
      if (user) {
        loginEl.classList.add("hidden");
        accountEl.classList.remove("hidden");
        document.getElementById("email").textContent =
          user.email || "Keine E-Mail verfügbar";
        document.getElementById("userId").textContent = user.id;
        setStatus("Erfolgreich angemeldet.");
      } else {
        loginEl.classList.remove("hidden");
        accountEl.classList.add("hidden");
        setStatus("Bitte melde dich an.");
      }
    }

    try {
      if (
        SUPABASE_URL === "DEINE_SUPABASE_PROJECT_URL" ||
        SUPABASE_KEY === "DEIN_PUBLISHABLE_KEY"
      ) {
        throw new Error(
          "Bitte zuerst deine Supabase-URL und deinen Publishable Key eintragen."
        );
      }

      supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      });

      googleBtn.addEventListener("click", () => signIn("google"));
      discordBtn.addEventListener("click", () => signIn("discord"));

      async function signIn(provider) {
        setBusy(true);
        setStatus("Weiterleitung zur Anmeldung …");

        try {
          const { error } = await supabase.auth.signInWithOAuth({
            provider,
            options: {
              redirectTo: window.location.href.split("#")[0].split("?")[0]
            }
          });

          if (error) throw error;
        } catch (error) {
          setStatus("Anmeldefehler: " + error.message);
          setBusy(false);
        }
      }

      logoutBtn.addEventListener("click", async () => {
        setBusy(true);
        const { error } = await supabase.auth.signOut();

        if (error) {
          setStatus("Abmeldefehler: " + error.message);
        }
        setBusy(false);
      });

      supabase.auth.onAuthStateChange((_event, session) => {
        showUser(session?.user ?? null);
        setBusy(false);
      });

      const { data, error } = await supabase.auth.getSession();
      if (error) throw error;
      showUser(data.session?.user ?? null);

    } catch (error) {
      setStatus("Einrichtungsfehler: " + error.message);
      setBusy(false);
    }
  </script>
</body>
</html>
